<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalender Taruna Bangsa</title>
<meta name="description" content="Kalender pendidikan semua unit dan booking fasilitas Sekolah Taruna Bangsa.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign-in screen -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="eyebrow">Sekolah Taruna Bangsa</div>
    <h1>Kalender &amp; Fasilitas</h1>
    <p id="gate-msg">Masuk dengan akun Google sekolah untuk melihat kalender semua unit dan booking fasilitas.</p>
    <div class="gate-actions" id="gate-actions">
      <button class="btn primary" id="btn-login" type="button">Masuk dengan Google</button>
    </div>
    <a class="hint" href="/privacy">Kebijakan privasi</a>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <div class="eyebrow" id="ta-label">Tahun Ajaran</div>
      <h1>Kalender &amp; Fasilitas Taruna Bangsa</h1>
    </div>
    <div class="actions">
      <button class="btn" id="btn-import" type="button">Impor dari Excel</button>
      <button class="btn" id="btn-fac" type="button">Kelola fasilitas</button>
      <button class="btn primary" id="btn-add" type="button">+ Kegiatan / Booking</button>
      <button class="btn ghost userchip" id="btn-user" type="button" title="Keluar"></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Tampilan">
      <button type="button" data-view="kalender" aria-pressed="true">Kalender</button>
      <button type="button" data-view="fasilitas" aria-pressed="false">Jadwal fasilitas</button>
      <button type="button" data-view="agenda" aria-pressed="false">Agenda</button>
    </div>
    <div class="chips" id="unit-chips" aria-label="Filter unit"></div>
    <div class="spacer"></div>
    <select id="fac-filter" aria-label="Filter fasilitas"></select>
    <button type="button" class="alert-pill" id="clash-pill" hidden></button>
  </div>

  <div id="banner"></div>
  <main id="view"></main>
  <div class="legend" id="legend"></div>
</div>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
